[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "trazas"
dynamic = ["version"]
description = "Realistic, labelled attack log generator for testing detection rules without a lab."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Geiner Jiménez Villegas" }]
requires-python = ">=3.10"
dependencies = []  # zero runtime dependencies on purpose: minimal supply-chain surface
keywords = ["security", "detection-engineering", "siem", "mitre-attack", "kql", "sigma", "logs", "blue-team"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Education",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.11", "ruff>=0.6", "pre-commit>=3.8"]

[project.scripts]
trazas = "trazas.cli:main"

[project.urls]
Homepage = "https://github.com/OWNER/trazas"
Issues = "https://github.com/OWNER/trazas/issues"
Changelog = "https://github.com/OWNER/trazas/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/trazas/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/trazas"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "UP", "B", "S", "SIM", "C4", "DTZ", "PT", "RUF", "PL", "ARG", "PTH", "N",
]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["trazas"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = ["if TYPE_CHECKING:"]
